<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

      h1 {

        font-size: 300%;

    <!-- STYLE-->

  </head>
  <body>
    <div class="header">
      <a href="index.html">
        <img
          src="images/StinebFullLogo.png"
          width="60"
          alt="Home"
          title="Trang chủ"
        />
      </a>

      <button id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
    <hr />

    <marquee behavior="slide" direction="down" scrollamount="6">

    <br /><br /><br />
    <marquee style="font-size: medium" direction="down" scrollamount="2">
      chiến luôn 👇🏻 bạn sợ à?
    </marquee>

    <p style="text-align: center; font-size: 200%">
      <a href="HTML/LamBai.html"
        ><img class="wid20" src="images/startButton.png" alt=""
      /></a>
    </p>
    <br /><br /><br />
    <div class="ButtonsContainer">
      <div class="Button">
        <a href="HTML/LyThuyet.html"

      <div class="Button">

      CHÚNG TÔI</a
    >

    <script>
      function toggleTheme() {
        document.body.classList.toggle("dark-mode");

        const btn = document.getElementById("themeBtn");

        if (document.body.classList.contains("dark-mode")) {
          btn.innerHTML = "☀️";
        } else {
          btn.innerHTML = "🌙";
        }
      }
    </script>
  </body>
